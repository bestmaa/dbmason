name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CONNECTION_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  DATABASE_URL: file:./ci-control.db
  DATABASE_HOST_ALLOWLIST: 127.0.0.1,localhost
  DBMASON_PUBLIC_URL: http://localhost:3000
  PAYLOAD_SECRET: ci-only-payload-secret-never-use-in-production-2026

jobs:
  quality:
    name: Quality, audit, and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: pnpm
          node-version: 24.18.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run architectural quality gate
        run: pnpm check
      - name: Verify generated files are committed
        run: |
          changes="$(git status --porcelain --untracked-files=all)"
          if [ -n "${changes}" ]; then
            printf '%s\n' "${changes}"
            exit 1
          fi
      - name: Audit dependencies
        run: |
          pnpm audit --prod --audit-level low
          # GHSA-mh99-v99m-4gvg remains only through legacy ESLint plugins
          # that require brace-expansion 1.x; no compatible patched 1.x exists.
          pnpm audit --dev --audit-level low --ignore GHSA-mh99-v99m-4gvg
      - name: Build standalone application
        run: pnpm build
      - name: Enforce the production runtime boundary
        run: pnpm check:runtime
      - name: Verify third-party license inventory
        run: |
          legal_root="$(mktemp -d)"
          pnpm --config.optional=false licenses list --prod --json > "${legal_root}/production.json"
          node scripts/collect-third-party-licenses.mjs \
            node_modules "${legal_root}/third-party-licenses" \
            .next/standalone/node_modules "${legal_root}/production.json"
          test -s "${legal_root}/third-party-licenses/INDEX.json"

  database-integration:
    name: ${{ matrix.engine }} integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        engine: [PostgreSQL, MySQL]
        include:
          - engine: PostgreSQL
            env_example: .env.postgres-test.example
            env_file: .env.postgres-test
            test_command: pnpm test:postgres
            down_command: pnpm postgres:test:down
          - engine: MySQL
            env_example: .env.mysql-test.example
            env_file: .env.mysql-test
            test_command: pnpm test:mysql
            down_command: pnpm mysql:test:down
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: pnpm
          node-version: 24.18.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare isolated test environment
        run: cp "${{ matrix.env_example }}" "${{ matrix.env_file }}"
      - name: Run real database integration suite
        run: ${{ matrix.test_command }}
      - name: Stop isolated database harness
        if: always()
        run: ${{ matrix.down_command }}

  browser:
    name: ${{ matrix.engine }} Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        engine: [PostgreSQL, MySQL]
        include:
          - engine: PostgreSQL
            env_example: .env.postgres-test.example
            env_file: .env.postgres-test
            test_command: pnpm test:e2e:mvp
            down_command: pnpm postgres:test:down
          - engine: MySQL
            env_example: .env.mysql-test.example
            env_file: .env.mysql-test
            test_command: pnpm test:e2e:mysql
            down_command: pnpm mysql:test:down
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: pnpm
          node-version: 24.18.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium runtime
        run: pnpm exec playwright install --with-deps chromium
      - name: Prepare isolated test environment
        run: cp "${{ matrix.env_example }}" "${{ matrix.env_file }}"
      - name: Run browser workflow
        run: ${{ matrix.test_command }}
      - name: Stop isolated database harness
        if: always()
        run: ${{ matrix.down_command }}
